[project]
name = "openbga-fresh-coa-lims"
version = "0.1.0"
description = "OpenBGA Fresh CoA LIMS: open-source software for manufacturing quality-control laboratories"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
keywords = ["lims", "laboratory", "quality-control", "manufacturing", "django"]
dependencies = [
  "Django>=5.2.19,<5.3",
  "psycopg[binary]>=3.3.8,<4",
  "gunicorn>=26.2,<27",
  "whitenoise>=6.12,<7",
  "dj-database-url>=3,<4",
  "weasyprint>=70,<71",
]

[project.urls]
Homepage = "https://openbga.github.io/fresh-coa-lims/"
Repository = "https://github.com/openbga/fresh-coa-lims"
Documentation = "https://github.com/openbga/fresh-coa-lims/tree/main/docs"
Issues = "https://github.com/openbga/fresh-coa-lims/issues"
Changelog = "https://github.com/openbga/fresh-coa-lims/blob/main/CHANGELOG.md"
Support = "https://bgasoft.com"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-django>=4.14,<5",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.17.4,<0.18",
]
e2e = [
    "pytest-playwright>=0.10,<0.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "accounts/tests", "catalog/tests", "suppliers/tests", "sampling/tests", "analytical/tests", "laboratory/tests", "stability/tests", "reporting/tests", "pagedocs/tests"]


[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
